<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up • Court Reserve</title>

  <!-- Bootstrap first -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!--Custom styles override Bootstrap where needed -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="logo">Court Reserve</div>
    <nav>
      <ul>
        <li><a href="{{ url_for('home') }}">Home</a></li>
        <li><a href="{{ url_for('reservations') }}">Reservations</a></li>
        <li><a href="{{ url_for('about') }}">About</a></li>
        <li><a href="{{ url_for('profile') }}">Profile</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <h1>Create an Account</h1>
    <p>Sign up to save and manage your reservations.</p>
  </section>

  <section class="py-4">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card shadow-sm p-4">
            {% if error %}
              <div class="alert alert-danger mb-3">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('signup') }}">
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
              </div>

              <button type="submit" class="btn w-100">
                Sign Up
              </button>
            </form>

            <p class="text-center mt-3 mb-0">
              Already have an account?
              <a href="{{ url_for('login') }}">Log in</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Court Reserve - Kidus Assefa. All rights reserved.</p>
  </footer>
</body>
</html>
